project:
  type: website
  # Comment out modules you're not iterating on to speed up preview/render.
  render:
    - index.qmd
    - docs/**/*.qmd
    # Modules
    - modules/M1/**/*.qmd
    # - modules/M2/**/*.qmd
    # - modules/M3/**/*.qmd
    - modules/M4/**/*.qmd
  preview:
    port: 4200
  resources:
    - slide-chrome.js

website:
  title: "Deep Learning with PyTorch"
  site-url: https://hassanalgoz.github.io/dl/

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
  revealjs:
    css: styles.css
    width: 1600
    height: 900
    slide-number: false
    chalkboard: true
    controls: true
    hash-type: number
    history: false
    date-format: "YYYY-MM-DD"
    include-after-body:
      - text: |
          <script>
          (() => {
            const path = location.pathname || "/";
            const m = path.match(/^(.*?\/)(?:modules|docs)\//);
            const root = m
              ? m[1]
              : path.endsWith("/")
                ? path
                : path.replace(/\/[^/]*$/, "/");
            const s = document.createElement("script");
            s.src = root + "slide-chrome.js";
            document.body.appendChild(s);
          })();
          </script>

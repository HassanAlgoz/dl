project:
  type: website
  render:
    - "**/*.qmd"
    - "!.venv/**"
  preview:
    port: 4200

website:
  title: "Deep Learning with PyTorch"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
  revealjs:
    css: styles.css
    width: 1600
    height: 900
    slide-number: true
    chalkboard: true
    controls: true
    hash-type: number
    history: false
    include-after-body:
      - text: |
          <a class="slide-home" href="../../../index.html" title="Back to course index" aria-label="Back to course index">⌂</a>
